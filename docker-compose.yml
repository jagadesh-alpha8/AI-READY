# Production compose file -- run on the deploy server, not for local dev.
# Images are pulled from GHCR (built by .github/workflows/ci-cd.yml), never
# built on the VM itself. Requires a `.env` file next to this one -- copy
# `.env.production.example` and fill in real values.

# Cap each container's log at 3 x 10 MB -- Docker's default log grows forever
# and eventually fills the VM disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    # Redis is the Celery broker: queued and reserved extraction tasks live here. The image's default keeps only
    # periodic RDB snapshots, so a restart could drop the last minutes of queued work. Append-only file, synced
    # every second (at most ~1s of writes lost on a crash), plus the snapshots. PostgreSQL stays the source of
    # truth: anything still lost is re-queued by the recovery job (apps/extraction/services/recovery.py).
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", "900", "1", "--save", "300", "100"]
    volumes:
      - redis_data:/data

  backend:
    image: ghcr.io/jagadesh-alpha8/ai-ready-backend:latest
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      # Shared cache (login throttles, admin-login limit, watcher lock) in Redis db 1.
      DJANGO_CACHE_URL: redis://redis:6379/1
      # nginx sits in front: take the client address from X-Forwarded-For.
      TRUSTED_PROXY_COUNT: "1"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "3", "--timeout", "120"]
    # "Is the API actually serving?" -- database + cache via /api/v1/health.
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8000/api/v1/health', headers={'Host': os.environ.get('ALLOWED_HOSTS','localhost').split(',')[0].strip(), 'X-Forwarded-Proto': 'https'}), timeout=8)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  celery:
    image: ghcr.io/jagadesh-alpha8/ai-ready-backend:latest
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      backend:
        condition: service_started
    environment:
      DJANGO_CACHE_URL: redis://redis:6379/1
    volumes:
      - media_data:/app/media
      # PaddleOCR downloads its models on first use into ~/.paddlex; keep them
      # across deploys instead of re-downloading into each new container.
      - paddle_models:/root/.paddlex
    # Worker slots come from settings: AI_PROCESSING_MODE (single = 2,
    # multi_router = routers x AI_ROUTER_MAX_CONCURRENT), or CELERY_WORKER_CONCURRENCY
    # if set. No --concurrency flag here, so the mode decides.
    # Queues: CELERY_WORKER_QUEUES (default "celery", Celery's default queue). With a separate OCR queue
    # (OCR_QUEUE=ocr, EXTRACTION_QUEUE=extraction in .env) set CELERY_WORKER_QUEUES=extraction here and start
    # the celery-ocr service below (docker compose --profile ocr-queue up -d).
    command: ["sh", "-c", "exec celery -A config worker -l info -Q $${CELERY_WORKER_QUEUES:-celery}"]
    # Warm shutdown on deploy: a document mid-AI-call gets a moment to reach a checkpoint. Whatever is still
    # running is re-queued by the recovery job and continues from its saved pages / chunks.
    stop_grace_period: 60s

  # Optional OCR worker (profile "ocr-queue"): reads documents' pages -- text layer + PaddleOCR, CPU-bound -- on
  # OCR_QUEUE, sized for this server's CPU (CELERY_OCR_CONCURRENCY, default 1 process per 2 cores is a sensible
  # start) independently of the AI worker's slots, which follow the provider / router quota.
  celery-ocr:
    image: ghcr.io/jagadesh-alpha8/ai-ready-backend:latest
    profiles: ["ocr-queue"]
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DJANGO_CACHE_URL: redis://redis:6379/1
    volumes:
      - media_data:/app/media
      - paddle_models:/root/.paddlex
    command: ["sh", "-c", "exec celery -A config worker -l info -n ocr@%h -Q $${OCR_QUEUE:-ocr} --concurrency $${CELERY_OCR_CONCURRENCY:-1}"]
    stop_grace_period: 60s

  # Scheduler: the extraction-job recovery every EXTRACTION_RECOVERY_INTERVAL_SECONDS (default 5 min) and the
  # daily source watcher (when WATCHER_ENABLED=true); the celery worker above does the work. Exactly one beat
  # must run.
  celery-beat:
    image: ghcr.io/jagadesh-alpha8/ai-ready-backend:latest
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    depends_on:
      redis:
        condition: service_started
      celery:
        condition: service_started
    command: ["celery", "-A", "config", "beat", "-l", "info", "-s", "/tmp/celerybeat-schedule"]

  frontend:
    image: ghcr.io/jagadesh-alpha8/ai-ready-frontend:latest
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static_data:/usr/share/nginx/html/static:ro
      # HTTPS: certbot on the VM writes the domain check files and the
      # certificate here (see frontend/nginx.conf).
      - /var/www/certbot:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:
  paddle_models:
