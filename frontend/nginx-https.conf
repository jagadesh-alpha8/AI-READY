# Public site: https://ai.ingageedutech.com
#
# Port 80 only answers Let's Encrypt's domain check and redirects everything
# else to HTTPS. The certificate is issued and renewed by certbot on the VM
# (webroot /var/www/certbot) into /etc/letsencrypt -- both folders are mounted
# into this container by docker-compose.yml.

server {
    listen 80;
    server_name _;

    # Let's Encrypt domain check (certbot --webroot -w /var/www/certbot).
    # Must stay on plain HTTP and must not be redirected.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    # Everything else -> HTTPS on the domain (an IP address has no certificate).
    location / {
        return 301 https://ai.ingageedutech.com$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/ai.ingageedutech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.ingageedutech.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    # Document uploads go up to 50MB (see MAX_DOCUMENT_UPLOAD_SIZE) -- nginx's
    # 1MB default would reject them before they ever reach the backend.
    client_max_body_size 100m;

    # Django admin/static assets, collected into a volume shared with the
    # backend container at build/deploy time (see docker-compose.yml).
    location /static/ {
        alias /usr/share/nginx/html/static/;
        access_log off;
        expires 30d;
    }

    # X-Forwarded-Proto is "https" here, which is what tells Django
    # (SECURE_PROXY_SSL_HEADER) the request is secure -- so its
    # SECURE_SSL_REDIRECT stops bouncing API calls.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The app shell is always re-checked (a 304 when unchanged), so after a deploy
    # browsers load the new screens instead of an old cached menu.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Built files have a content hash in their name and never change: cache for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
}
