# Plain-HTTP site, used until the HTTPS certificate exists on the VM.
# Once /etc/letsencrypt/live/ai.ingageedutech.com/ is there, the container
# serves nginx-https.conf instead (see choose-site-config.sh).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Document uploads go up to 50MB (see MAX_DOCUMENT_UPLOAD_SIZE) -- nginx's
    # 1MB default would reject them before they ever reach the backend.
    client_max_body_size 100m;

    # Django admin/static assets, collected into a volume shared with the
    # backend container at build/deploy time (see docker-compose.yml).
    location /static/ {
        alias /usr/share/nginx/html/static/;
        access_log off;
        expires 30d;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The app shell is always re-checked (a 304 when unchanged), so after a deploy
    # browsers load the new screens instead of an old cached menu.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Built files have a content hash in their name and never change: cache for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Let's Encrypt domain check (certbot --webroot -w /var/www/certbot).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

}
