name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/ai-ready-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/ai-ready-frontend

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements/*.txt

      - run: pip install -r requirements/development.txt

      - run: python manage.py test
        env:
          SECRET_KEY: ci-test-secret-key
          JWT_SECRET_KEY: ci-test-jwt-secret-key
          DEBUG: "True"
          ALLOWED_HOSTS: localhost,127.0.0.1

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build

  build-and-push:
    needs: [backend-test, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GCP VM over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          # Public domain of the site (DNS A record -> the VM). Added to the
          # server's .env on every deploy -- see "Make sure the domain is allowed".
          APP_DOMAIN: ai.ingageedutech.com
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_SSH_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          port: ${{ secrets.GCP_SSH_PORT || 22 }}
          envs: GHCR_TOKEN,GHCR_ACTOR,APP_DOMAIN
          script: |
            set -e
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
            cd /opt/ai-ready
            # Pull with this run's short-lived GitHub token over HTTPS instead of
            # an SSH key stored on the VM (which can be lost or rotated). The
            # token is used for this one fetch and not saved in the git config.
            git fetch "https://x-access-token:${GHCR_TOKEN}@github.com/${{ github.repository }}.git" main
            git merge --ff-only FETCH_HEAD

            # Make sure the domain is allowed. Django answers "Bad Request (400)"
            # to any host name missing from ALLOWED_HOSTS, so the domain must be
            # in the server's .env. Only ADDS the domain to the existing lists
            # (the IP and anything else already there stay); does nothing when
            # it is already present; keeps a one-time backup of the original.
            ENV_CHANGED=0
            add_to_env_list() {
              key="$1"; value="$2"
              current=$(grep "^${key}=" .env | tail -1 | cut -d= -f2- | tr -d '\r')
              case ",${current}," in
                *",${value},"*) return 0 ;;
              esac
              [ -f .env.before-domain ] || cp -p .env .env.before-domain
              if grep -q "^${key}=" .env; then
                sed -i "s|^${key}=.*|${key}=${current:+${current},}${value}|" .env
              else
                printf '\n%s=%s\n' "$key" "$value" >> .env
              fi
              echo "Added ${value} to ${key} in .env"
              ENV_CHANGED=1
            }
            if [ -n "$APP_DOMAIN" ]; then
              add_to_env_list ALLOWED_HOSTS "$APP_DOMAIN"
              add_to_env_list CORS_ALLOWED_ORIGINS "http://$APP_DOMAIN"
              add_to_env_list CORS_ALLOWED_ORIGINS "https://$APP_DOMAIN"
            fi

            # Free disk space BEFORE pulling. The backend image is large since
            # OCR (PaddleOCR/PyMuPDF) was added, and a pull needs room for the
            # old image, the download and the extracted new layers at once.
            # Only images and build cache are pruned -- NEVER volumes: they hold
            # the PostgreSQL database (postgres_data) and uploaded files (media_data).
            # Images used by running containers are kept, so the site stays up.
            docker image prune -af
            docker builder prune -af || true

            FREE_GB=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
            echo "Free disk before pull: ${FREE_GB} GB"
            if [ "$FREE_GB" -lt 6 ]; then
              echo "Only ${FREE_GB} GB free on the VM; pulling the new images needs about 6 GB."
              echo "Increase the VM boot disk (see deploy notes). The running site was not changed."
              docker system df
              exit 1
            fi

            docker compose pull
            docker compose up -d --remove-orphans
            # A changed .env only reaches a container when it is recreated.
            if [ "$ENV_CHANGED" = "1" ]; then
              docker compose up -d --force-recreate --no-deps backend celery
            fi
            # Remove the now-unused previous images.
            docker image prune -af

      # The deploy above only proves the containers started. This proves the
      # site works end to end (nginx -> Django -> database + cache) over HTTPS;
      # if not, the run fails and GitHub notifies whoever pushed.
      - name: Check the live site is healthy
        run: |
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "https://ai.ingageedutech.com/api/v1/health"; then
              echo; echo "Site healthy."; exit 0
            fi
            echo "  not healthy yet (attempt $i), retrying in 10 s"; sleep 10
          done
          echo "The site did not become healthy within 5 minutes after deploy."; exit 1

      # Benchmark Studio is read-only; its catalogue comes from the manager's workbooks in source_library_work/.
      # Loaded after the site is healthy (migrations done). Re-running with unchanged workbooks changes nothing,
      # and nothing is deleted (other draft benchmarks are withdrawn). A manual dry run: "Benchmark catalogue sync".
      - name: Load the Benchmark Studio catalogue from the workbooks
        uses: appleboy/ssh-action@v1.2.0
        env:
          ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_SSH_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          port: ${{ secrets.GCP_SSH_PORT || 22 }}
          envs: ACTOR
          script: |
            set -e
            cd /opt/ai-ready
            REGISTER=InGage_Source_Register_BenchMarking_Structure.xlsx
            AIQIF=InGage_AI_QIF_Benchmark_Master_v1_0_AI_Criteria.xlsx
            for f in "$REGISTER" "$AIQIF"; do
              docker compose cp "source_library_work/$f" "backend:/tmp/$f"
            done
            echo "=== Source Library ==="
            docker compose exec -T backend python manage.py import_source_register "/tmp/$REGISTER" --commit \
              --actor "deploy:$ACTOR"
            echo "=== AI-QIF catalogue ==="
            docker compose exec -T backend python manage.py import_aiqif "/tmp/$AIQIF" --commit --withdraw-others \
              --actor "deploy:$ACTOR"
            docker compose exec -T backend rm -f "/tmp/$REGISTER" "/tmp/$AIQIF"
