components:
  schemas:
    ActionEnum:
      enum:
      - confirmed
      - corrected
      - rejected
      - evidence_requested
      type: string
      description: |-
        * `confirmed` - Confirmed
        * `corrected` - Corrected
        * `rejected` - Rejected
        * `evidence_requested` - Evidence Requested
