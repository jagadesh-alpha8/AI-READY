          type: array
          items:
            $ref: '#/components/schemas/PillarScore'
          readOnly: true
        strengths:
          type: array
          items:
            $ref: '#/components/schemas/PillarSummary'
          readOnly: true
        weaknesses:
          type: array
          items:
            $ref: '#/components/schemas/PillarSummary'
          readOnly: true
        evidence_metrics:
          type: object
          additionalProperties: {}
          readOnly: true
        unresolved_blocking_gaps:
          type: array
          items:
            $ref: '#/components/schemas/GapItem'
          readOnly: true
      required:
      - calculated_at
      - calculation_version
      - cri_confidence
      - cri_score
      - evidence_metrics
      - overall_confidence
      - overall_cri
      - pillar_scores
      - sprint_id
      - strengths
      - unresolved_blocking_gaps
      - weaknesses
