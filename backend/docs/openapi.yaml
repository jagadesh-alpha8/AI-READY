      description: |-
        * `classifying_documents` - Classifying Documents
        * `reading_pages` - Reading Pages
        * `extracting_facts` - Extracting Facts
        * `mapping_audit_fields` - Mapping Audit Fields
        * `detecting_gaps` - Detecting Gaps
        * `checking_conflicts` - Checking Conflicts
        * `preparing_review_workspace` - Preparing Review Workspace
    DataTypeEnum:
      enum:
      - string
      - number
      - percentage
      - boolean
      - date
      - currency
      - list
      type: string
      description: |-
        * `string` - String
        * `number` - Number
        * `percentage` - Percentage
        * `boolean` - Boolean
        * `date` - Date
        * `currency` - Currency
        * `list` - List
