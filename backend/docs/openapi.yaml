          readOnly: true
        title:
          type: string
          maxLength: 255
        original_filename:
          type: string
          readOnly: true
        mime_type:
          type: string
          readOnly: true
        file_size:
          type: integer
          readOnly: true
          nullable: true
        file_size_display:
          type: string
          readOnly: true
        checksum:
          type: string
          readOnly: true
          description: SHA-256 hex digest
        download_url:
          type: string
          readOnly: true
        has_file:
          type: string
          readOnly: true
        uploaded_by:
          type: string
          format: uuid
          readOnly: true
        owner_role:
          type: string
          maxLength: 50
        status:
          $ref: '#/components/schemas/DocumentStatusEnum'
        page_count:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        quality_score:
