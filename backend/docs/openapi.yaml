      type: object
      description: |-
        Read and write shape for an administered user.

        `password` is write-only and optional on update — an admin changing a
        colleague's department should not have to reset their password to do it.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        username:
          type: string
          pattern: ^[\w.@+-]+$
          maxLength: 150
