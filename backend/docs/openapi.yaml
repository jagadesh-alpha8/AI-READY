      operationId: v1_sprints_score_retrieve_2
      description: |-
        GET returns the sprint's current, explainable CRI score -- computing
        it once, on first access, if the sprint has never been scored. POST
        forces a fresh recalculation from the sprint's current fact/gap data.
      parameters:
      - in: path
        name: sprint_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SprintScore'
          description: ''
    post:
