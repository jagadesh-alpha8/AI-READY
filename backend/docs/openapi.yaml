components:
  schemas:
    Baseline:
      type: object
      description: |-
        A sprint's current (or a specific) baseline decision-cycle, plus the
        headline numbers off the exact ScoringRun it's pinned to -- so a report
        or the approval screen never has to make a second call just to show the
        CRI/confidence a decision was actually made against.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        sprint_id:
          type: string
          format: uuid
          readOnly: true
        scoring_run_id:
          type: string
          format: uuid
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/BaselineStatusEnum'
          readOnly: true
        overall_cri:
          type: number
          format: double
          readOnly: true
        overall_confidence:
          type: number
          format: double
          readOnly: true
        calculation_version:
          type: string
          readOnly: true
        pillar_snapshot:
          readOnly: true
        approved_by:
          type: string
          format: uuid
          readOnly: true
        approved_by_name:
          type: string
          readOnly: true
        approved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        comments:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        history:
          type: array
          items:
            $ref: '#/components/schemas/BaselineDecisionHistory'
          readOnly: true
      required:
      - approved_at
      - approved_by
      - approved_by_name
      - calculation_version
      - comments
      - created_at
      - history
      - id
      - overall_confidence
      - overall_cri
      - pillar_snapshot
      - scoring_run_id
      - sprint_id
      - status
      - updated_at
    BaselineAction:
      type: object
      description: |-
        Shared body for approve / approve-provisional / return -- `comments`
        is optional for approve/approve-provisional, required for return (that
        stricter rule is enforced in apps.scoring.services.baseline, where the
        'required for return but not the others' business rule actually lives,
        rather than needing three near-identical serializer subclasses here).
      properties:
        comments:
          type: string
          default: ''
    BaselineDecisionHistory:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        action:
          allOf:
          - $ref: '#/components/schemas/BaselineDecisionHistoryActionEnum'
          readOnly: true
        user:
          type: string
          format: uuid
          readOnly: true
        user_name:
          type: string
          readOnly: true
        comments:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - comments
      - created_at
      - id
      - user
      - user_name
    BaselineDecisionHistoryActionEnum:
      enum:
      - submitted
      - approved
      - approved_provisional
      - returned
      type: string
      description: |-
        * `submitted` - Submitted
        * `approved` - Approved
        * `approved_provisional` - Approved Provisionally
        * `returned` - Returned for Correction
    BaselineStatusEnum:
      enum:
      - pending
      - approved
      - provisional
      - returned
      type: string
      description: |-
        * `pending` - Pending
        * `approved` - Approved
        * `provisional` - Provisional
        * `returned` - Returned
    Benchmark:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        benchmark_code:
          type: string
          readOnly: true
        title:
          type: string
          readOnly: true
        pillar_code:
          type: string
          readOnly: true
        pillar_name:
          type: string
          readOnly: true
        capability:
          type: string
          readOnly: true
        benchmark_kind:
          allOf:
          - $ref: '#/components/schemas/BenchmarkKindEnum'
          readOnly: true
          description: |-
            mandatory = backed by mandatory/authoritative sources; proposed = InGage proposal (needs an expert owner + release approval).

            * `mandatory` - Mandatory
            * `recommended` - Recommended
            * `guidance` - Guidance
            * `proposed` - Proposed
        kind_label:
          type: string
          readOnly: true
        benchmark_class:
          type: string
          readOnly: true
          description: As written in the Source Pack.
        version_label:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusAcdEnum'
          readOnly: true
        applicability:
          type: string
          readOnly: true
          description: Institution types, as written in the Source Pack.
        source_basis:
          type: string
          readOnly: true
          description: Sources named in the Source Pack (not yet linked requirements).
        scoring_dimensions:
          type: string
          readOnly: true
        activation_status:
          type: string
          readOnly: true
        expert_owner:
          type: string
          readOnly: true
        target_guidance:
          type: string
          readOnly: true
        evidence_types:
          type: array
          items:
            type: string
          readOnly: true
        maturity_levels:
          type: array
          items:
            $ref: '#/components/schemas/MaturityDefinition'
          readOnly: true
        requirement_count:
          type: integer
          readOnly: true
        levels_defined:
          type: string
          readOnly: true
        framework:
          type: string
          readOnly: true
        weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
          description: Provisional weight out of 1000 (AI-QIF key indicator weight).
        pillar_weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,2})?$
          readOnly: true
        naac_crosswalk:
          readOnly: true
          description: NAAC metrics whose evidence can support this benchmark [{metric,
            requirement, relationship}]. Supporting only, never proof.
        confirmation:
          type: string
          readOnly: true
      required:
      - activation_status
      - applicability
      - benchmark_class
      - benchmark_code
      - benchmark_kind
      - capability
      - confirmation
      - evidence_types
      - expert_owner
      - framework
      - id
      - kind_label
      - levels_defined
      - maturity_levels
      - naac_crosswalk
      - pillar_code
      - pillar_name
      - pillar_weight
      - requirement_count
      - scoring_dimensions
      - source_basis
      - status
      - target_guidance
      - title
      - version_label
      - weight
    BenchmarkKindEnum:
      enum:
      - mandatory
      - recommended
      - guidance
      - proposed
      type: string
      description: |-
